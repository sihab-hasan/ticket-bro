<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{appName}}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #111827;
    }

    a {
      color: inherit;
    }
  </style>
</head>
<body>
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
    {{previewText}}
  </div>

  <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td align="center" style="padding: 32px 12px;">
        <table width="560" cellpadding="0" cellspacing="0" role="presentation" style="width:100%;max-width:560px;background:#ffffff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;">
          <tr>
            <td style="padding: 24px 28px;background:#111827;text-align:center;">
              <img
                src="{{brandLogoUrl}}"
                alt="{{appName}}"
                height="28"
                style="display:block;margin:0 auto 10px;border:0;"
              />
              <div style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:0.02em;">
                {{appName}}
              </div>
            </td>
          </tr>

          {{{body}}}

          <tr>
            <td style="padding: 20px 28px;background:#f9fafb;border-top:1px solid #e5e7eb;">
              <p style="margin:0 0 10px;font-size:12px;line-height:1.7;color:#6b7280;text-align:center;">
                This is an automated email from <strong>{{appName}}</strong>.
              </p>
              <p style="margin:0;font-size:12px;line-height:1.7;color:#9ca3af;text-align:center;">
                If you were not expecting this message, you can safely ignore it or contact support.
              </p>
            </td>
          </tr>
        </table>

        <table width="560" cellpadding="0" cellspacing="0" role="presentation" style="width:100%;max-width:560px;margin-top:12px;">
          <tr>
            <td align="center" style="font-size:11px;color:#9ca3af;line-height:1.8;">
              <a href="{{privacyUrl}}" style="text-decoration:none;color:#9ca3af;">Privacy</a>
              <span style="padding:0 8px;color:#d1d5db;">|</span>
              <a href="{{termsUrl}}" style="text-decoration:none;color:#9ca3af;">Terms</a>
              <p style="margin:8px 0 0;color:#c4c7cf;">&copy; {{currentYear}} {{appName}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
