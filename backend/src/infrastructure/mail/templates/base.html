<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{appName}}</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { border: 0; outline: none; text-decoration: none; display: block; }
    body { margin: 0; padding: 0; background-color: #ebebeb; }
    a { color: inherit; text-decoration: none; }
  </style>
</head>
<body style="margin:0;padding:0;">

  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;color:#ebebeb;line-height:1px;max-width:0;opacity:0;">
    {{previewText}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:32px 12px 40px;">

        <table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0"
               style="width:100%;max-width:520px;">

          <!-- HEADER -->
          <tr>
            <td style="background:#111111;padding:26px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td>
                    <img src="{{brandLogoUrl}}" alt="{{appName}}" height="26"
                         style="height:26px;width:auto;" />
                  </td>
                  <td align="right"
                      style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
                             font-size:18px;font-weight:700;color:#ffffff;
                             letter-spacing:0.12em;text-transform:uppercase;white-space:nowrap;">
                    {{appName}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- CARD -->
          <tr>
            <td style="background:#ffffff;border-left:1px solid #d8d8d8;border-right:1px solid #d8d8d8;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                {{{body}}}
              </table>
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="background:#f5f5f5;border:1px solid #d8d8d8;border-top:1px solid #e0e0e0;padding:18px 32px;">
              <p style="margin:0 0 6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
                        font-size:11px;line-height:1.6;color:#999999;text-align:center;">
                Automated message from <span style="color:#555555;font-weight:600;">{{appName}}</span>. Do not reply directly.
              </p>
              <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
                        font-size:11px;line-height:1.6;color:#bbbbbb;text-align:center;">
                If you weren't expecting this, you can safely ignore it.
              </p>
            </td>
          </tr>

          <!-- SUB-FOOTER -->
          <tr>
            <td style="padding:14px 32px 0;" align="center">
              <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
                        font-size:11px;color:#bbbbbb;line-height:1.8;">
                <a href="{{privacyUrl}}" style="color:#999999;text-decoration:underline;">Privacy</a>
                &nbsp;&middot;&nbsp;
                <a href="{{termsUrl}}" style="color:#999999;text-decoration:underline;">Terms</a>
                <br>&copy; {{currentYear}} {{appName}}
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
