<tr>
  <td style="padding:32px 28px 18px;">
    <div style="margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#6b7280;">Verification code</div>
    <h1 style="margin:0 0 14px;font-size:24px;line-height:1.3;color:#111827;">
      Use this code to continue
    </h1>
    <p style="margin:0 0 14px;font-size:15px;line-height:1.7;color:#4b5563;">
      Hi {{greetingName}}, enter this code to complete {{purpose}}.
    </p>
  </td>
</tr>
<tr>
  <td align="center" style="padding:10px 28px 24px;">
    <div style="display:inline-block;padding:18px 26px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;font-size:34px;letter-spacing:0.3em;font-weight:700;color:#111827;">
      {{otp}}
    </div>
  </td>
</tr>
<tr>
  <td style="padding:0 28px 28px;">
    <p style="margin:0 0 12px;font-size:14px;line-height:1.7;color:#4b5563;">
      This code expires in 10 minutes.
    </p>
    <p style="margin:0;font-size:14px;line-height:1.7;color:#4b5563;">
      Never share this code with anyone.
    </p>
  </td>
</tr>
