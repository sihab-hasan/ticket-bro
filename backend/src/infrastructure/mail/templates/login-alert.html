<tr>
  <td style="padding:32px 28px 18px;">
    <div style="margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#6b7280;">Security alert</div>
    <h1 style="margin:0 0 14px;font-size:24px;line-height:1.3;color:#111827;">
      New login detected
    </h1>
    <p style="margin:0;font-size:15px;line-height:1.7;color:#4b5563;">
      Hi {{greetingName}}, we noticed a new login on your account.
    </p>
  </td>
</tr>
<tr>
  <td style="padding:10px 28px 24px;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="border:1px solid #e5e7eb;border-radius:12px;background:#f9fafb;">
      <tr>
        <td style="padding:14px 18px;font-size:13px;color:#6b7280;border-bottom:1px solid #e5e7eb;">
          <strong style="display:block;color:#111827;font-size:12px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Time</strong>
          <span>{{loginTime}}</span>
        </td>
      </tr>
      <tr>
        <td style="padding:14px 18px;font-size:13px;color:#6b7280;border-bottom:1px solid #e5e7eb;">
          <strong style="display:block;color:#111827;font-size:12px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">IP address</strong>
          <span>{{ipAddress}}</span>
        </td>
      </tr>
      <tr>
        <td style="padding:14px 18px;font-size:13px;color:#6b7280;">
          <strong style="display:block;color:#111827;font-size:12px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Device</strong>
          <span>{{device}}</span>
        </td>
      </tr>
    </table>
  </td>
</tr>
<tr>
  <td style="padding:0 28px 28px;">
    <div style="padding:14px 16px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;font-size:13px;line-height:1.7;color:#9a3412;">
      If this was not you, reset your password immediately and review your account activity.
    </div>
  </td>
</tr>
