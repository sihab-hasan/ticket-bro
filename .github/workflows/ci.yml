name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      EMAIL_VERIFICATION_SECRET: ci-email-verification-secret
      PASSWORD_RESET_SECRET: ci-password-reset-secret
      MONGODB_URI: mongodb://localhost:27017/ticket-bro-ci
      MONGODB_URI_TEST: mongodb://localhost:27017/ticket-bro-ci-test
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:5000
      VITE_API_BASE_URL: /api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend and backend dependencies
        run: npm run install:all

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run backend tests
        run: npm run test:backend
